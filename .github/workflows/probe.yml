name: probe
on: { push: { branches: [probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py > out.txt 2>&1 || true; cat out.txt
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "probe-${{ github.run_number }}" out.txt --target probe -t probe -n probe
