name: Build FlyerPlus APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Signing config (only if KEYSTORE secrets are set)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFileDir=%s\nstorePassword=%s\nkeyAlias=flyerplus\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" >> local.properties
      - name: Build
        run: ./gradlew --no-daemon --stacktrace :android:assembleRelease
      - name: Rename APK
        run: mv android/build/outputs/apk/release/*.apk FlyerPlus.apk
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" FlyerPlus.apk -t "FlyerPlus build ${{ github.run_number }}" -n "Built from ${{ github.sha }}"
